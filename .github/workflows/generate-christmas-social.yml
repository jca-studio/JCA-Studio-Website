name: Generate Christmas social preview
on:
  push:
    branches: [editorial-redesign]
    paths:
      - '.github/workflows/generate-christmas-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser capture tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture authentic homepage artwork at LinkedIn dimensions
        run: |
          python3 -m http.server 8765 >/tmp/jca-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle',timeout:60000});
            const feature=page.locator('.graphic--argos');
            await feature.waitFor({state:'visible'});
            await feature.evaluate(el=>{
              el.style.width='1200px';
              el.style.height='630px';
              el.style.minHeight='630px';
              el.style.maxWidth='1200px';
              el.style.flex='none';
              el.style.transform='none';
            });
            await page.evaluate(()=>document.fonts.ready);
            await feature.screenshot({path:'assets/argos-social-preview.png',animations:'disabled'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit generated preview image to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/argos-social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Add authentic Christmas social share preview"
            git push origin HEAD:editorial-redesign
          fi
